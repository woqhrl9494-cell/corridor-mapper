name: Numerical tests
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Legacy SURF fixtures were hashed on macOS/arm64; exact hashes are
          # platform-specific. Keep that full suite and test current DRF on Linux.
          - runner: macos-26
            command: npm test
          - runner: ubuntu-latest
            command: node --test tests/drf/*.test.mjs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Test committed sources and offline bundle
        run: ${{ matrix.command }}
        env:
          PSPT_FULL_PARITY: '1'
      - name: Verify reproducible offline build
        run: |
          npm run build:drf-offline
          git diff --exit-code -- drf/offline.bundle.js
